[project]
name = "interviewgraph"
version = "0.1.0"
description = ""
authors = [
    {name = "Ashish Nevan",email = "nevchris242@gmail.com"},
    {name = "Neha Devarapalli",email = "devarapalli.n@northeastern.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "streamlit (>=1.44.1,<2.0.0)",
    "langgraph-cli[inmem] (>=0.2.3,<0.3.0)",
    "uvicorn (>=0.34.1,<0.35.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
ruff = "^0.11.5"

[tool.poetry.group.test.dependencies]
pytest = {extras = ["asyncio"], version = "^8.3.5"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
