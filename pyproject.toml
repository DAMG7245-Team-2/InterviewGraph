[project]
name = "interviewgraph"
version = "0.1.0"
description = ""
authors = [
    {name = "Ashish Nevan",email = "nevchris242@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph (>=0.3.25,<0.4.0); python_version >= '3.9' and python_version < '4.0'",
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "streamlit (>=1.44.1,<2.0.0)",
    "langgraph-cli[inmem] (>=0.2.3,<0.3.0)",
    "pytest-asyncio (>=0.26.0,<0.27.0)",
    "langchain-pinecone (>=0.2.5,<0.3.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
interview-agent = { path = "backend/interview_agent", develop = true }
python-dotenv = ">=1.0.1"
langchain = ">=0.3.23,<0.4.0"
langchain-openai = ">=0.3.12,<0.4.0"
scipy = ">=1.15.2,<2.0.0"
numpy = ">=2.2.4,<3.0.0"
elevenlabs = ">=1.56.0,<2.0.0"
sounddevice = ">=0.5.1,<0.6.0"
openai = ">=1.72.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[tool.poetry.group.test.dependencies]
pytest = {extras = ["asyncio"], version = "^8.3.5"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
